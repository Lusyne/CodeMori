[workspace]
members = ["crates/codemori-core", "crates/codemori-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Lusyne"]
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
url = "2"
